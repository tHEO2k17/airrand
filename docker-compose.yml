services:
  postgres:
    image: postgres:16-alpine
    container_name: airrand-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airrand
    ports:
      - "5433:5432"
    volumes:
      - airrand_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airrand"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  airrand_pg_data:
